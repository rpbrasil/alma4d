name: Build and Publish Docker image (Playwright)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (sha + latest)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/alma4d:latest
            ghcr.io/${{ github.repository_owner }}/alma4d:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: manual App Service deploy steps removed to avoid editor linter errors.
      # You can perform App Service container configuration manually or add a separate deploy workflow.
