name: Fix 404 - Deploy Standalone

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Prepare Package
        run: |
          mkdir out
          # 1. Copia o core do standalone
          cp -r .next/standalone/. out/
          
          # 2. MOVE as pastas que o standalone não traz por padrão para o local correto
          mkdir -p out/.next/static
          cp -r .next/static/. out/.next/static/
          cp -r public/. out/public/

      - name: Login Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_90E427DC40B14D62B4856B70B6E489AF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3DD2A63434FE40BBBE27FB7E9723BF9B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_019BFA850FAD45DCB1FFB3C9956EC255 }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: alma4dash
          package: ./out
          clean: true # CRUCIAL: Remove lixo de deploys antigos que causam o 404