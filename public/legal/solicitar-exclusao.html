<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitação de Exclusão de Dados | alma4D</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
            background: #ffffff;
            color: #1f2937;
            margin: 0;
            padding: 32px 16px;
            line-height: 1.6;
        }

        main {
            max-width: 520px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        header img {
            width: 96px;
            margin-bottom: 16px;
        }

        h1 {
            color: #030870;
            font-size: 22px;
        }

        form {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
        }

        label {
            font-weight: 700;
            font-size: 14px;
        }

        input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0 16px;
        }

        button {
            width: 100%;
            background: #030870;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .notice {
            font-size: 13px;
            color: #374151;
        }

        footer {
            font-size: 12px;
            color: #6b7280;
            margin-top: 28px;
            text-align: center;
        }
    </style>

    <script>
        function mascaraCPF(v) {
            return v.replace(/\D/g, "")
                .replace(/(\d{3})(\d)/, "$1.$2")
                .replace(/(\d{3})(\d)/, "$1.$2")
                .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        }

        function mascaraCel(v) {
            return v.replace(/\D/g, "")
                .replace(/(\d{2})(\d)/, "($1) $2")
                .replace(/(\d{5})(\d)/, "$1-$2")
                .slice(0, 15);
        }

        function validarCPF(cpf) {
            cpf = cpf.replace(/\D/g, "");
            if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

            let soma = 0, resto;

            for (let i = 0; i < 9; i++)
                soma += parseInt(cpf[i]) * (10 - i);

            resto = (soma * 10) % 11;
            if (resto === 10) resto = 0;
            if (resto !== parseInt(cpf[9])) return false;

            soma = 0;
            for (let i = 0; i < 10; i++)
                soma += parseInt(cpf[i]) * (11 - i);

            resto = (soma * 10) % 11;
            if (resto === 10) resto = 0;

            return resto === parseInt(cpf[10]);
        }

        function gerarProtocolo() {
            const d = new Date();
            const data = d.toISOString().slice(0, 10).replace(/-/g, "");
            const hora = d.toTimeString().slice(0, 8).replace(/:/g, "");
            const rand = Math.floor(100 + Math.random() * 900);
            return `ALMA4D-${data}-${hora}-${rand}`;
        }

        function enviarSolicitacao() {
            const cpf = document.getElementById("cpf").value;
            const cel = document.getElementById("celular").value;

            if (!validarCPF(cpf)) {
                alert("CPF inválido. Verifique os dados informados.");
                return;
            }

            if (!cel) {
                alert("Informe o celular cadastrado.");
                return;
            }

            const protocolo = gerarProtocolo();

            const body = encodeURIComponent(
                `Protocolo: ${protocolo}\n\n` +
                `Solicito o processamento da exclusão dos dados pessoais do usuário cadastrado no aplicativo alma4D,\n` +
                `identificado pelo CPF ${cpf} e telefone celular ${cel}.\n\n` +
                `Declaro ser o titular dos dados informados e estou ciente de que a solicitação será analisada\n` +
                `conforme a Lei nº 13.709/2018 (LGPD), podendo haver retenção temporária de dados\n` +
                `para cumprimento de obrigações legais ou contratuais.\n\n` +
                `Prazo de processamento: até 48 horas após validação.`
            );

            window.location.href =
                `mailto:cliente@voss.digital?subject=Solicitação de Exclusão de Dados - ${protocolo}&body=${body}`;
        }
    </script>
</head>

<body>
    <main>
        <header>
            <img src="https://alma4d.com.br/images/alma4d-bicolor-nobground-256.png" alt="alma4D" />
            <h1>Solicitação de Exclusão de Dados</h1>
        </header>

        <form onsubmit="event.preventDefault(); enviarSolicitacao();">
            <label>Celular cadastrado (login)</label>
            <input id="celular" oninput="this.value = mascaraCel(this.value)" placeholder="(11) 99999-9999">

            <label>CPF do titular</label>
            <input id="cpf" oninput="this.value = mascaraCPF(this.value)" placeholder="000.000.000-00">

            <p class="notice">
                Os dados elegíveis serão excluídos ou anonimizados em até <strong>48 horas</strong>,
                salvo hipóteses legais de retenção.
            </p>

            <button type="submit">Enviar solicitação por e‑mail</button>
        </form>

        <footer>
            <p>Contato oficial: <strong>cliente@voss.digital</strong></p>
        </footer>
    </main>
</body>

</html>
